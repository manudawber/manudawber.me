<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="author" content="Manu Dawber">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manu Dawber</title>
    <!-- Importing Inter (Sans) for both modes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        /* Base (Light Mode) */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc;
            color: #111;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Dark Mode */
        .dark body {
            background-color: #111;
            color: #fcfcfc;
        }

        .rgb-wrapper {
            position: relative;
            display: inline-block;
            cursor: default;
        }

        .rgb-layer {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -0.05em; 
            line-height: 1;
            white-space: nowrap;
            mix-blend-mode: multiply;
            will-change: transform, filter;
        }

        .is-transitioning .rgb-layer {
            transition: transform var(--anim-duration, 400ms) ease-out, filter var(--anim-duration, 400ms) ease-out; 
        }

        .dark .rgb-layer {
            mix-blend-mode: screen; 
        }

        .layer-1, .layer-2, .layer-3 {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 1; 
            pointer-events: none; 
        }

        /* Light Mode Colors (CMY) */
        .layer-1 { color: #00FFFF; z-index: 3; }
        .layer-2 { color: #FF00FF; z-index: 2; }
        .layer-3 { color: #FFFF00; z-index: 1; }

        /* Dark Mode Colors (RGB) */
        .dark .layer-1 { color: #FF0000; }
        .dark .layer-2 { color: #00FF00; }
        .dark .layer-3 { color: #0000FF; }

        .layer-black {
            position: relative;
            color: transparent;
            z-index: 4;
        }

        @media (min-width: 640px) {
            .rgb-layer { font-size: 6rem; }
        }
        @media (min-width: 768px) {
            .rgb-layer { font-size: 8rem; }
        }
        
        input[type=range] {
            accent-color: #111;
        }
        .dark input[type=range] {
            accent-color: #fcfcfc;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col justify-center items-center transition-colors duration-300">

    <!-- Theme Toggle -->
    <button id="theme-toggle" class="fixed top-6 right-6 z-50 p-2 rounded-full text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors" aria-label="Toggle Dark Mode">
        <svg id="theme-toggle-light-icon" class="hidden w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        <svg id="theme-toggle-dark-icon" class="hidden w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
    </button>

    <!-- Controls Toggle Button -->
    <button id="toggle-controls" class="fixed bottom-4 right-4 z-50 bg-white/90 dark:bg-gray-800/90 backdrop-blur px-4 py-2 rounded-full shadow-md border border-gray-200 dark:border-gray-700 text-sm font-semibold dark:text-white hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
        Tune Effect
    </button>

    <!-- Floating Control Panel -->
    <div id="control-panel" class="fixed bottom-16 right-4 z-50 bg-white/90 dark:bg-gray-800/90 backdrop-blur p-5 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 text-sm w-80 hidden flex-col gap-4 transition-opacity dark:text-gray-200">
        <div class="flex justify-between items-center mb-1">
            <h3 class="font-bold text-gray-800 dark:text-white">Effect Parameters</h3>
            <button id="close-controls" class="text-gray-400 hover:text-gray-800 dark:hover:text-white">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg>
            </button>
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-xs text-gray-400">
                <label for="inp-base">Base Spread</label>
                <span id="val-base">0.041</span>
            </div>
            <input type="range" id="inp-base" min="0" max="0.1" step="0.001" value="0.041" class="w-full">
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-xs text-gray-400">
                <label for="inp-safe">Safe Zone Buffer</label>
                <span id="val-safe">0.05</span>
            </div>
            <input type="range" id="inp-safe" min="0" max="1" step="0.01" value="0.05" class="w-full">
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-xs text-gray-400">
                <label for="inp-power">Ramp Power (Curve)</label>
                <span id="val-power">1.5</span>
            </div>
            <input type="range" id="inp-power" min="1" max="3" step="0.1" value="1.5" class="w-full">
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-xs text-gray-400">
                <label for="inp-mult">Ramp Multiplier</label>
                <span id="val-mult">0.099</span>
            </div>
            <input type="range" id="inp-mult" min="0" max="0.2" step="0.001" value="0.099" class="w-full">
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-xs text-gray-400">
                <label for="inp-angle">Angle Offset (Deg)</label>
                <span id="val-angle">12</span>
            </div>
            <input type="range" id="inp-angle" min="0" max="90" step="1" value="12" class="w-full">
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-xs text-gray-400">
                <label for="inp-blur">Blur Multiplier</label>
                <span id="val-blur">0.061</span>
            </div>
            <input type="range" id="inp-blur" min="0" max="0.2" step="0.001" value="0.061" class="w-full">
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-xs text-gray-400">
                <label for="inp-scale">Scale Multiplier</label>
                <span id="val-scale">0.003</span>
            </div>
            <input type="range" id="inp-scale" min="0" max="0.02" step="0.0001" value="0.003" class="w-full">
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-xs text-gray-400">
                <label for="inp-anim">Animation Duration (ms)</label>
                <span id="val-anim">400</span>
            </div>
            <input type="range" id="inp-anim" min="0" max="2000" step="50" value="400" class="w-full">
        </div>

        <div class="flex items-center gap-2 mt-2 pt-4 border-t border-gray-200 dark:border-gray-700">
            <input type="checkbox" id="inp-fps" class="rounded text-gray-800 focus:ring-gray-800 dark:focus:ring-gray-200 cursor-pointer">
            <label for="inp-fps" class="text-xs text-gray-600 dark:text-gray-300 font-semibold cursor-pointer">Show Performance Monitor</label>
        </div>
    </div>

    <!-- FPS Counter Display -->
    <div id="fps-monitor" class="fixed top-4 left-4 z-50 bg-black/80 text-green-400 font-mono text-xs px-2 py-1 rounded hidden backdrop-blur">
        FPS: <span id="fps-val">60</span>
    </div>

    <!-- Main Hero Section -->
    <main class="flex flex-col items-center z-10">
        <!-- The Interactive Name -->
        <div class="rgb-wrapper" id="name-container">
            <div class="rgb-layer layer-1" id="layer1">Manu Dawber</div>
            <div class="rgb-layer layer-2" id="layer2">Manu Dawber</div>
            <div class="rgb-layer layer-3" id="layer3">Manu Dawber</div>
            <div class="rgb-layer layer-black">Manu Dawber</div>
        </div>
    </main>

    <script>
        const CONFIG = {
            baseSpreadMultiplier: 0.041, 
            safeZoneWidthRatio: 0.05,
            rampPower: 1.5,
            rampMultiplier: 0.099,
            angleOffset: 12,
            blurMultiplier: 0.061,
            scaleMultiplier: 0.003,
            animationDurationMs: 400
        };

        const toggleControlsBtn = document.getElementById('toggle-controls');
        const closeControlsBtn = document.getElementById('close-controls');
        const controlPanel = document.getElementById('control-panel');
        
        const inputs = {
            baseSpreadMultiplier: { el: document.getElementById('inp-base'), val: document.getElementById('val-base') },
            safeZoneWidthRatio: { el: document.getElementById('inp-safe'), val: document.getElementById('val-safe') },
            rampPower: { el: document.getElementById('inp-power'), val: document.getElementById('val-power') },
            rampMultiplier: { el: document.getElementById('inp-mult'), val: document.getElementById('val-mult') },
            angleOffset: { el: document.getElementById('inp-angle'), val: document.getElementById('val-angle') },
            blurMultiplier: { el: document.getElementById('inp-blur'), val: document.getElementById('val-blur') },
            scaleMultiplier: { el: document.getElementById('inp-scale'), val: document.getElementById('val-scale') },
            animationDurationMs: { el: document.getElementById('inp-anim'), val: document.getElementById('val-anim') }
        };

        const fpsCheckbox = document.getElementById('inp-fps');
        const fpsMonitor = document.getElementById('fps-monitor');
        const fpsVal = document.getElementById('fps-val');
        
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsLoopId;

        function fpsLoop() {
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fpsVal.textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }
            fpsLoopId = requestAnimationFrame(fpsLoop);
        }

        fpsCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                fpsMonitor.classList.remove('hidden');
                lastTime = performance.now();
                frameCount = 0;
                fpsLoop();
            } else {
                fpsMonitor.classList.add('hidden');
                cancelAnimationFrame(fpsLoopId);
            }
        });

        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        let isActive = false;

        toggleControlsBtn.addEventListener('click', () => {
            controlPanel.classList.remove('hidden');
            controlPanel.classList.add('flex');
            toggleControlsBtn.classList.add('hidden');
        });

        closeControlsBtn.addEventListener('click', () => {
            controlPanel.classList.add('hidden');
            controlPanel.classList.remove('flex');
            toggleControlsBtn.classList.remove('hidden');
        });

        Object.keys(inputs).forEach(key => {
            inputs[key].el.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                CONFIG[key] = value;
                inputs[key].val.textContent = value;
                
                if (key === 'animationDurationMs') {
                    document.documentElement.style.setProperty('--anim-duration', `${value}ms`);
                } else if (isActive) {
                    calculateEffect(cursorX, cursorY);
                }
            });
        });

        const container = document.getElementById('name-container');
        const layer1 = document.getElementById('layer1');
        const layer2 = document.getElementById('layer2');
        const layer3 = document.getElementById('layer3');
        const layers = [layer1, layer2, layer3];

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function setTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
            }
        }

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            setTheme(true);
        } else {
            setTheme(false);
        }

        themeToggleBtn.addEventListener('click', function() {
            const isDark = document.documentElement.classList.contains('dark');
            setTheme(!isDark);
            localStorage.setItem('color-theme', !isDark ? 'dark' : 'light');
        });

        function calculateEffect(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const dxCenter = centerX - clientX;
            const dyCenter = centerY - clientY;
            const centerDistance = Math.sqrt(dxCenter * dxCenter + dyCenter * dyCenter);

            const dxBox = Math.max(rect.left - clientX, 0, clientX - rect.right);
            const dyBox = Math.max(rect.top - clientY, 0, clientY - rect.bottom);
            const boxDistance = Math.sqrt(dxBox * dxBox + dyBox * dyBox);

            const safeZone = rect.width * CONFIG.safeZoneWidthRatio;

            let spread = centerDistance * CONFIG.baseSpreadMultiplier;

            if (boxDistance > safeZone) {
                const excessDistance = boxDistance - safeZone;
                spread += Math.pow(excessDistance, CONFIG.rampPower) * CONFIG.rampMultiplier;
            }

            const baseAngle = Math.atan2(dyCenter, dxCenter);
            
            const offsetRad = (CONFIG.angleOffset * Math.PI) / 180;

            const angle1 = baseAngle - offsetRad;
            const angle2 = baseAngle; 
            const angle3 = baseAngle + offsetRad;
            
            const blurAmount = spread * CONFIG.blurMultiplier;
            const scaleAmount = 1 + (spread * CONFIG.scaleMultiplier);

            const tx1 = (Math.cos(angle1) * spread).toFixed(1);
            const ty1 = (Math.sin(angle1) * spread).toFixed(1);
            const tx2 = (Math.cos(angle2) * spread).toFixed(1);
            const ty2 = (Math.sin(angle2) * spread).toFixed(1);
            const tx3 = (Math.cos(angle3) * spread).toFixed(1);
            const ty3 = (Math.sin(angle3) * spread).toFixed(1);
            
            const roundedBlur = blurAmount.toFixed(1);
            const roundedScale = scaleAmount.toFixed(3);

            layer1.style.transform = `translate(${tx1}px, ${ty1}px) scale(${roundedScale})`;
            layer2.style.transform = `translate(${tx2}px, ${ty2}px) scale(${roundedScale})`;
            layer3.style.transform = `translate(${tx3}px, ${ty3}px) scale(${roundedScale})`;
            
            layer1.style.filter = `blur(${roundedBlur}px)`;
            layer2.style.filter = `blur(${roundedBlur}px)`;
            layer3.style.filter = `blur(${roundedBlur}px)`;
        }

        function renderLoop() {
            if (isActive) {
                calculateEffect(cursorX, cursorY);
            }
            requestAnimationFrame(renderLoop);
        }

        requestAnimationFrame(renderLoop);

        let transitionTimeout;

        function handleMouseMove(e) {
            cursorX = e.clientX;
            cursorY = e.clientY;
            
            if (!isActive) {
                isActive = true;
                container.classList.add('is-transitioning');
                
                clearTimeout(transitionTimeout);
                transitionTimeout = setTimeout(() => {
                    if (isActive) {
                        container.classList.remove('is-transitioning');
                    }
                }, CONFIG.animationDurationMs);
            }
        }

        function resetEffect() {
            isActive = false;
            clearTimeout(transitionTimeout);
            container.classList.add('is-transitioning');

            layer1.style.transform = `translate(0px, 0px) scale(1)`;
            layer2.style.transform = `translate(0px, 0px) scale(1)`;
            layer3.style.transform = `translate(0px, 0px) scale(1)`;
            
            layer1.style.filter = `blur(0px)`;
            layer2.style.filter = `blur(0px)`;
            layer3.style.filter = `blur(0px)`;
        }

        window.addEventListener('mousemove', handleMouseMove);
        
        document.addEventListener('mouseleave', resetEffect);
        document.addEventListener('mouseout', (e) => {
            if (!e.relatedTarget) {
                resetEffect();
            }
        });
    </script>
</body>
</html>
